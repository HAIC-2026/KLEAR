id: profile-009
category: profile
question: How many kūpuna in my district live on fixed incomes?
context: [house, "022"]
ideal: Gives the kūpuna count and share in the selected House district, the median household income of kūpuna
  householders, kūpuna under the poverty level and under twice it, and kūpuna householders living alone, each with
  its margin of error and vintage. Gives the shares of households with Social Security, retirement income and SSI
  and says plainly that they cover all households, not only kūpuna households. Compares the rates and the median
  income with Honolulu County and Hawaiʻi, and lists SSI, SNAP, Med-QUEST and the state program of home and
  community services for kūpuna.
