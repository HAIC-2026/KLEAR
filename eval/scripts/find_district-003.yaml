# Scripted model turns for find_district-003: resolve place, search indicators, get facts, then submit.
- - type: tool_use
    name: resolve_place
    input:
      text: house:030
- - type: tool_use
    name: resolve_place
    input:
      text: "Hawaiʻi Senate District 15"
- - type: tool_use
    name: search_indicators
    input:
      words:
      - total
      - population
- - type: tool_use
    name: get_facts
    input:
      indicator_ids:
      - pop_total
      geos:
      - senate:015
- - type: tool_use
    name: submit_answer
    input:
      resolved: senate:015
      refusal: none
      blocks:
      - '{label:f1} in {geo:senate:015}: {fact:f1} ({vintage:f1}).'
      facts:
      - f1
      programs: []
      caveats: []
