# Scripted model turns for compare-005: resolve place, search indicators, compare, then submit.
- - type: tool_use
    name: resolve_place
    input:
      text: House District 28
- - type: tool_use
    name: resolve_place
    input:
      text: House District 22
- - type: tool_use
    name: search_indicators
    input:
      words:
      - kupuna
- - type: tool_use
    name: compare
    input:
      indicator_id: pct_65_plus
      geo: house:028
      against:
      - house:022
- - type: tool_use
    name: submit_answer
