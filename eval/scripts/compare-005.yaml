        error.'
      - '{geo:house:028}: Higher than {geo:state:15}. {label:f3} in {geo:state:15}:
        {fact:f3} ({vintage:f3}).'
      - '{geo:house:028}: Within the margin of error of {geo:house:022}. {label:f4}
        in {geo:house:022}: {fact:f4} ({vintage:f4}).'
      facts:
      - f1
      - f2
      - f3
      - f4
      programs: []
      caveats: []
