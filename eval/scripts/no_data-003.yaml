# Scripted model turns for no_data-003: resolve the district, find no matching indicator, decline as out of scope.
- - type: tool_use
    name: resolve_place
    input:
      text: "Hawaiʻi House District 29"
- - type: tool_use
    name: search_indicators
    input:
      words: [crime]
- - type: tool_use
    name: submit_answer
    input:
      resolved: "house:029"
      refusal: out_of_scope
      blocks:
        - "Crime data is not in the KLEAR data for {geo:house:029}. KLEAR covers population, income, housing, health and program facts for districts. The Hawaiʻi Department of the Attorney General publishes crime statistics."
      facts: []
      programs: []
      caveats: []
