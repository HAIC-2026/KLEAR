# Scripted model turns for follow_up-005: two earlier questions set the place and the group.
- - type: tool_use
    name: resolve_place
    input:
      text: senate:020
- - type: tool_use
    name: search_indicators
    input:
      words:
      - child
      - poverty
- - type: tool_use
    name: get_facts
    input:
      indicator_ids:
      - pct_children_poverty
