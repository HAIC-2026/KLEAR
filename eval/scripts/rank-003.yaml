# Scripted model turns for rank-003: find the indicator, rank the districts, then submit.
- - type: tool_use
    name: search_indicators
    input:
      words:
      - kupuna
      - poverty
- - type: tool_use
    name: rank_districts
    input:
      indicator: kupuna_under_200pct_poverty
      chamber: senate
- - type: tool_use
    name: submit_answer
    input:
      resolved: null
      refusal: none
      blocks:
      - 'The Senate districts with the most kūpuna counted as {label:f2} are these. Their ranges overlap, so the
        data cannot put them in order ({vintage:f2}):

        * {geo:senate:002}: {fact:f2}

        * {geo:senate:013}: {fact:f13}

        * {geo:senate:012}: {fact:f12}'
      facts:
      - f2
      - f13
      - f12
      programs: []
      caveats:
      - These count people or households who meet the income test only. Assets, age, immigration status and household
        rules also apply, and the Census Bureau's national poverty thresholds sit below the state's poverty guidelines,
        so counts near a program limit may run low.
