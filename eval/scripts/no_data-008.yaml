# Scripted model turns for no_data-008: Find no crash indicator and decline as out of scope, pointing to the Department of Transportation.
- - type: tool_use
    name: resolve_place
    input:
      text: "Hawaiʻi House District 40"
- - type: tool_use
    name: search_indicators
    input:
      words: ["car", "crashes"]
- - type: tool_use
    name: submit_answer
    input:
      resolved: "house:040"
      refusal: out_of_scope
      blocks:
        - "Traffic crashes are outside what KLEAR covers for {geo:house:040}, which is people, income, housing, health and benefit programs. The Hawaiʻi Department of Transportation publishes crash data."
      facts: []
      programs: []
      caveats: []
