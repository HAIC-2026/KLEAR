# Scripted model turns for profile-002: resolve the district, fetch total population and children, submit.
- - type: tool_use
    name: resolve_place
    input:
      text: "House District 1 in Hawaiʻi"
- - type: tool_use
    name: search_indicators
    input:
      words:
      - population
      - children
- - type: tool_use
    name: get_facts
    input:
      indicator_ids:
      - pop_total
      - pop_under_18
      geos:
      - "house:001"
- - type: tool_use
    name: submit_answer
    input:
      resolved: "house:001"
      refusal: none
      blocks:
      - "Population snapshot for {geo:house:001} ({vintage:f1}):\n* {label:f1}: {fact:f1}\n* {label:f2}: {fact:f2}"
      facts:
      - f1
      - f2
      programs: []
      caveats: []
