# Scripted model turns for rank-004: find the indicator and program, rank the districts, then submit.
- - type: tool_use
    name: search_indicators
    input:
      words:
      - SNAP
      - poverty
  - type: tool_use
    name: list_programs
    input:
      words:
      - SNAP
- - type: tool_use
    name: rank_districts
    input:
      indicator: hh_poverty_no_snap
      chamber: senate
- - type: tool_use
    name: submit_answer
    input:
      resolved: null
      refusal: none
      blocks:
      - '{geo:senate:012} has the most {label:f12} of any Senate district: {fact:f12} ({vintage:f12}). Its range sits above
        the range of every other Senate district, so SNAP outreach there could reach the most households.'
      facts:
      - f12
      programs:
      - snap_fy2027
      caveats:
      - These count people or households who meet the income test only. Assets, age, immigration status and household rules
        also apply, and the Census Bureau's national poverty thresholds sit below the state's poverty guidelines, so counts
        near a program limit may run low.
