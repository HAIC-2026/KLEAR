# Scripted model turns for no_data-001: WIC enrollment is statewide only, so name the agency and add the young children count.
- - type: tool_use
    name: resolve_place
    input:
      text: "House District 26 in Hawaiʻi"
- - type: tool_use
    name: list_programs
    input:
      words: [WIC]
- - type: tool_use
    name: search_indicators
    input:
      words: [WIC]
- - type: tool_use
    name: search_indicators
    input:
      words: [children, under, "5"]
- - type: tool_use
    name: get_facts
    input:
      indicator_ids: [pop_under_5]
      geos: ["house:026"]
- - type: tool_use
    name: submit_answer
    input:
      resolved: "house:026"
      refusal: not_available
      blocks:
        - "WIC enrollment for {geo:house:026} is not in the KLEAR data, because enrollment is published only statewide. The Hawaiʻi State Department of Health, WIC Services Branch holds enrollment figures."
        - "A related figure: {label:f1} in {geo:house:026} is {fact:f1} ({vintage:f1})."
      facts: [f1]
      programs: [wic_2026_27]
      caveats: []
