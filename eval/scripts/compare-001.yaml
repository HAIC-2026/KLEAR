# Scripted model turns for compare-001: resolve place, search indicators, compare, then submit.
- - type: tool_use
    name: resolve_place
    input:
      text: Senate District 12
- - type: tool_use
    name: resolve_place
    input:
      text: Oʻahu
- - type: tool_use
    name: search_indicators
    input:
      words:
      - child
      - poverty
- - type: tool_use
    name: compare
    input:
      indicator_id: pct_children_poverty
      geo: senate:012
- - type: tool_use
    name: submit_answer
    input:
      resolved: senate:012
      refusal: none
      blocks:
      - '{label:f1} in {geo:senate:012}: {fact:f1} ({vintage:f1}).'
      - '{geo:senate:012}: Within the margin of error of {geo:county:15003}. {label:f2}
        in {geo:county:15003}: {fact:f2} ({vintage:f2}).'
      - '{geo:senate:012}: Within the margin of error of {geo:state:15}. {label:f3}
        in {geo:state:15}: {fact:f3} ({vintage:f3}).'
      facts:
      - f1
      - f2
      - f3
      programs: []
      caveats: []
