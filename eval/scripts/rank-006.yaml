# Scripted model turns for rank-006: find the indicator and program, rank the districts, then submit.
- - type: tool_use
    name: search_indicators
    input:
      words:
      - working
      - poverty
  - type: tool_use
    name: list_programs
    input:
      words:
      - EITC
- - type: tool_use
    name: rank_districts
    input:
      indicator: working_below_poverty
      chamber: senate
- - type: tool_use
    name: submit_answer
    input:
      resolved: null
      refusal: none
      blocks:
      - 'Federal EITC outreach could reach the most {label:f1} in these Senate districts. Their ranges overlap, so the data
        cannot put them in order ({vintage:f1}):

        * {geo:senate:001}: {fact:f1}

        * {geo:senate:002}: {fact:f2}

        * {geo:senate:003}: {fact:f3}

        * {geo:senate:008}: {fact:f8}

        * {geo:senate:010}: {fact:f10}

        * {geo:senate:011}: {fact:f11}

        * {geo:senate:012}: {fact:f12}

        * {geo:senate:013}: {fact:f13}

        * {geo:senate:015}: {fact:f15}'
      facts:
      - f1
      - f2
      - f3
      - f8
      - f10
      - f11
      - f12
      - f13
      - f15
      programs:
      - eitc_federal_ty2026
      caveats:
      - These count people or households who meet the income test only. Assets, age, immigration status and household rules
        also apply, and the Census Bureau's national poverty thresholds sit below the state's poverty guidelines, so counts
        near a program limit may run low.
