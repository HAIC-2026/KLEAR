# Scripted model turns for no_district-002: a statewide ranking asked with no district chosen.
- - type: tool_use
    name: search_indicators
    input:
      words:
      - uninsured
- - type: tool_use
    name: rank_districts
    input:
      indicator: pct_uninsured
      chamber: senate
- - type: tool_use
    name: submit_answer
    input:
      resolved: null
      refusal: none
      blocks:
      - 'No single Senate district stands out for {label:f3}. These districts have the highest shares, and their
        ranges overlap, so the data cannot put them in order ({vintage:f3}):

        * {geo:senate:003}: {fact:f3}

        * {geo:senate:002}: {fact:f2}

        * {geo:senate:022}: {fact:f22}

        * {geo:senate:019}: {fact:f19}'
      facts:
      - f3
      - f2
      - f22
      - f19
      programs: []
      caveats: []
