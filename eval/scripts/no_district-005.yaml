# Scripted model turns for no_district-005: a district named in the question with none chosen.
- - type: tool_use
    name: resolve_place
    input:
      text: Senate District 14
- - type: tool_use
    name: search_indicators
    input:
      words:
      - unemployment
- - type: tool_use
    name: get_facts
    input:
      indicator_ids:
      - unemployment_rate
      geos:
      - senate:014
- - type: tool_use
    name: submit_answer
    input:
      resolved: senate:014
      refusal: none
      blocks:
      - '{label:f1} in {geo:senate:014}: {fact:f1} ({vintage:f1}).'
      facts:
      - f1
      programs: []
      caveats: []
