# Scripted model turns for profile-008: resolve the district, fetch the civilian veteran count, submit.
- - type: tool_use
    name: resolve_place
    input:
      text: "Senate District 6 in Hawaiʻi"
- - type: tool_use
    name: search_indicators
    input:
      words:
      - veterans
- - type: tool_use
    name: get_facts
    input:
      indicator_ids:
      - civilian_veterans
      geos:
      - "senate:006"
- - type: tool_use
    name: submit_answer
    input:
      resolved: "senate:006"
      refusal: none
      blocks:
      - "{label:f1} in {geo:senate:006}: {fact:f1} ({vintage:f1})."
      facts:
      - f1
      programs: []
      caveats: []
