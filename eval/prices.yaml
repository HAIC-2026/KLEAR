# Claude API prices in dollars per million tokens, used to estimate and cap live eval spend.
verified: "2026-11-13 HST"
source: 'Anthropic pricing page (platform.claude.com/docs/en/about-claude/pricing), "Model pricing" table, Anthropic first-party API'
# Assumed average tokens per question for the cost estimate (an assumption, not a measurement).
assumed_tokens_per_question:
  input: 8000
  output: 1000
# cache_write is the 5-minute cache write price (1.25 times input). cache_read is the cache hit price:
# 0.1 times input on Haiku 5.5, 0.05 times input on Sonnet 5.5 and Opus 5.5.
models:
  # Haiku prices rise beyond 100K-token prompts (0.50, 0.625, 0.05 and 2.50); the agent's input cap stays below.
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
