# Weekly check of every program rule and contact against its official page. See docs/KEEPING-CURRENT.md.
name: freshness
on:
  schedule:
    # Mondays at 18:00 UTC, 8:00 HST.
    - cron: "0 18 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: freshness
  cancel-in-progress: false
jobs:
  check:
    name: Check rules and programs against official pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TITLE: Program information needs review
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Fetch each official page and compare
        id: check
        run: uv run python -m klear.rules check --report freshness.md
      - name: Show the list on the run page
        if: ${{ !cancelled() }}
        run: if [ -f freshness.md ]; then cat freshness.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Open or update the review issue
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f freshness.md ]; then
            echo "The check stopped before it could list the items. See the run log." > freshness.md
          fi
          printf '\nRun: %s\n' "$RUN_URL" >> freshness.md
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file freshness.md
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "The check failed again. The list above is up to date. Run: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file freshness.md
          fi
