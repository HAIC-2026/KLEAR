note: Kūpuna Care has no income limit in statute. A care recipient must be 60 or older, a U.S. citizen or lawful permanent resident, live outside a long-term care facility, have no comparable home- and community-based service, and have impairments in at least two activities of daily living, or a substantive cognitive impairment, among the combinations HRS §349-16 lists. The statute was last amended in 2022, so effective is the start of the year it was read in.
