note: The chart is listed on https://medquest.hawaii.gov/content/medquest/en/resources/rules-and-policy.html. Adults 19 to 64 qualify at 133% of the Hawaiʻi poverty guideline, or 138% with the 5% disregard. Assets are exempt for groups under MAGI rules. Only the adult limits are stored, because the chart's columns for children and pregnant women do not line up one to one with its group headings.
