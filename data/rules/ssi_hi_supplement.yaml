note: The amounts are the combined federal and state monthly payment. People living independently get only the federal amount ($994), so the state supplement is the difference in foster or domiciliary care, for example $1,823 minus $994 is $829 a month for one person in an adult foster care home. Hawaiʻi sets amounts for eligible children itself.
