# Other names people use, as search suggests them, each pointing to islands, divisions, neighborhoods or Census
# places by the names above. A Census place shared by two islands names its island in parentheses. Names already
# found by search, such as Kakaʻako inside Ala Moana-Kakaʻako, need no entry here. Search ignores ʻokina, kahakō,
# case and punctuation, so St. Louis Heights also matches st louis heights.
