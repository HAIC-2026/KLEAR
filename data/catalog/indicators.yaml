# Curated ACS 2020-2024 5-year indicators loaded into the KLEAR fact store.
# An entry may add geo_types, the geographies it is published for (default: state, county, senate, house),
# and note, a caveat stated with every figure. A detailed-table count may give bins in place of acs_var:
# published cells summed, with the margin of error as the root sum of squares of theirs.
# Every entry, here and under other_sources at the end, gives the website's reader text (klear/labels.py):
# short_label, at most 45 characters, shown on tiles, charts and answers in place of the official label, and
# plain, a one-sentence definition shown one tap away with the official label and universe. The official label
# stays in the store for the agent and the eval.
indicators:
  - indicator_id: pop_total
    label: "Total population"
    short_label: "Total population"
    plain: "Everyone who lives here, of any age."
    unit: count
    universe: "Total population"
    acs_var: DP05_0001
    dataset: acs/acs5/profile
  - indicator_id: pop_under_5
    label: "Population under 5 years"
    short_label: "Keiki (under 5)"
