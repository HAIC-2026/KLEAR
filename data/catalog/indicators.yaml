# Reader text for indicators from other sources. Their official label, unit and universe are set where
# they are built, in klear/etl, and the website shows them one tap away from the short label.
other_sources:
  # IRS Statistics of Income (klear/etl/irs.py)
  - indicator_id: irs_returns
    short_label: "Tax returns filed"
    plain: "Federal income tax returns filed by people who live here."
  - indicator_id: irs_eitc_returns
    short_label: "Tax returns claiming the EITC"
    plain: "Tax returns that claimed the earned income tax credit (EITC), a federal tax break for people who work and earn low to moderate pay."
  - indicator_id: irs_eitc_dollars
    short_label: "EITC dollars claimed"
    plain: "The total earned income tax credit (EITC) claimed on tax returns from here, in dollars."
  # CMS marketplace open enrollment (klear/etl/cms.py)
  - indicator_id: aca_consumers
    short_label: "Marketplace plan enrollees"
    plain: "People who picked a health plan on HealthCare.gov during the yearly sign-up period."
  - indicator_id: aca_aptc_consumers
    short_label: "Enrollees with premium tax credits"
    plain: "Marketplace enrollees who get a tax credit, paid each month, that lowers what they pay for their plan."
  # HUD housing choice vouchers (klear/etl/hud.py)
  - indicator_id: hud_vouchers
    short_label: "Housing voucher holders"
    plain: "Households that use a Housing Choice Voucher, once called Section 8, to help pay rent to a private landlord."
  # HUD and HRSA sites (klear/etl/sites.py)
  - indicator_id: sites_health_center
    short_label: "Health center sites"
    plain: "Community health center clinics, which see patients whether or not they can pay and charge less to people with lower incomes."
  - indicator_id: sites_public_housing
    short_label: "Public housing developments"
    plain: "Housing that a public housing agency owns and rents to people with low incomes."
  - indicator_id: sites_lihtc
    short_label: "Low-income housing tax credit projects"
    plain: "Rental housing built or fixed up with federal tax credits, which must keep rents low for tenants with lower incomes."
  - indicator_id: units_public_housing
    short_label: "Public housing units"
    plain: "Homes in public housing projects."
  - indicator_id: units_lihtc
    short_label: "Low-income units at tax credit projects"
    plain: "Homes at low-income housing tax credit projects that are set aside for tenants with lower incomes."
  # CDC PLACES modeled estimates (klear/etl/places.py)
  - indicator_id: places_food_insecurity
    short_label: "Adults facing food insecurity"
    plain: "The modeled percent of adults who say that in the past year their food ran out before they had money to buy more."
  - indicator_id: places_housing_insecurity
    short_label: "Adults facing housing insecurity"
    plain: "The modeled percent of adults who say that in the past year they could not pay their rent, mortgage or utility bills."
  - indicator_id: places_lack_transport
    short_label: "Adults without reliable transportation"
    plain: "The modeled percent of adults who say a lack of rides kept them from doctor visits, work or daily needs in the past year."
  - indicator_id: places_utility_shutoff_threat
    short_label: "Adults facing a utility shut-off"
    plain: "The modeled percent of adults who say that in the past year their power, gas or water company threatened to shut off service."
  - indicator_id: places_uninsured_18_64
    short_label: "Adults 18 to 64 without health insurance"
    plain: "The modeled percent of adults 18 to 64 who have no health insurance."
  - indicator_id: places_received_snap
    short_label: "Adults who received SNAP"
    plain: "The modeled percent of adults who say they got SNAP food benefits in the past year."
  # HUD CHAS housing cost burden (klear/etl/chas.py)
  - indicator_id: chas_renter_lowinc
    short_label: "Low-income renter households"
    plain: "Renter households with income at or below 80% of the area median income."
  - indicator_id: chas_owner_lowinc
    short_label: "Low-income owner households"
    plain: "Owner households with income at or below 80% of the area median income."
  - indicator_id: chas_renter_lowinc_burdened
    short_label: "Low-income renters with high housing costs"
    plain: "Renter households with income at or below 80% of the area median income that spend more than 30% of it on housing."
  - indicator_id: chas_owner_lowinc_burdened
    short_label: "Low-income owners with high housing costs"
    plain: "Owner households with income at or below 80% of the area median income that spend more than 30% of it on housing."
